services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: attendance-db-prod
    restart: always
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - attendance-network
    # Only expose on localhost for security
    ports:
      - "127.0.0.1:5432:5432"

  # FastAPI Backend
  backend:
    build:
      context: ../../student-attendance-tracker-api
      dockerfile: Dockerfile
    container_name: attendance-backend-prod
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      COOKIE_DOMAIN: .kotoio.fi
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: production
      DEBUG: "false"
      # Basic auth for /docs, /redoc and /openapi.json. These were ABSENT from this block for
      # months while sitting correctly set in .env, so the container never received them and the
      # app fell back to its built-in admin/changeme. app/config.py now refuses to start without
      # them outside development, so a repeat cannot go unnoticed.
      DOCS_USERNAME: ${DOCS_USERNAME}
      DOCS_PASSWORD: ${DOCS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - attendance-network
    # Not exposed outside container network

  # Nginx Reverse Proxy (API Gateway)
  nginx:
    image: nginx:alpine
    container_name: attendance-nginx-prod
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Read certs straight from the certbot live directory. Never copy them:
      # a copy goes stale the moment certbot renews.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for the ACME HTTP-01 challenge, so renewal never needs port 80.
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - attendance-network

volumes:
  postgres_data_prod:
    name: attendance_postgres_prod

networks:
  attendance-network:
    name: attendance-prod-network
    driver: bridge

