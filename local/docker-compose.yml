version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: attendance-db-local
    restart: unless-stopped
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: local_dev_password_123
      POSTGRES_DB: attendance_tracker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-network

  # PostgreSQL Test Database (for running tests with real database)
  db-test:
    image: postgres:17-alpine
    container_name: attendance-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: test_password_123
      POSTGRES_DB: attendance_tracker_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_tracker_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-network
    profiles:
      - test

  # FastAPI Backend
  backend:
    build:
      context: ../../student-attendance-tracker-api
      dockerfile: Dockerfile
    container_name: attendance-backend-local
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../../student-attendance-tracker-api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://attendance_user:local_dev_password_123@db:5432/attendance_tracker
      SECRET_KEY: local-dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - attendance-network

volumes:
  postgres_data_local:
    name: attendance_postgres_local

networks:
  attendance-network:
    name: attendance-local-network
    driver: bridge

