# EDITING THIS FILE IS NOT ENOUGH. It is a SINGLE-FILE bind mount
# (`./nginx.conf:/etc/nginx/nginx.conf:ro`), and Docker binds a single file by INODE. The deploy's
# `git reset --hard` REPLACES the file, so a running container's mount still points at the old,
# unlinked inode and nginx keeps serving the bytes it started with. `nginx -t` then validates the
# stale config and `nginx -s reload` reloads it, both succeeding, which is how the 2026-09-11
# deploy of spec 0005 slice 6 went green with none of its nginx changes live.
#
# The container must be RECREATED, not reloaded:
#   docker compose -f deployment/production/docker-compose.yml up -d --force-recreate --no-deps nginx
#
# `.github/workflows/backend.yml` step 7b does this automatically -- it compares this file's
# sha256 against what the container actually reads and recreates on a difference. If you change
# this file outside a deploy, run that command yourself and verify with:
#   docker compose -f deployment/production/docker-compose.yml exec -T nginx \
#     sha256sum /etc/nginx/nginx.conf

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # `request_id=` goes on the end, so anything parsing these lines by position keeps working.
    # $request_id is nginx's own per-request value, the same one every proxied location forwards
    # downstream as X-Request-ID, so an app JSON line and the access line for one request carry
    # a single id and AC-12's join is on that id. uvicorn's access line carries no id at all --
    # app/middleware/context.py explains why proximity is not the mechanism. This is the nginx
    # access line, which is a different line.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'request_id=$request_id';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name attendance-api.kotoio.fi;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server (API Gateway Only)
    # Note: Frontend is deployed on Vercel, this server only handles backend API
    server {
        listen 443 ssl;
        server_name attendance-api.kotoio.fi;

        # SSL Configuration (Let's Encrypt)
        # Points at the certbot live symlinks, so `certbot renew` + `nginx -s reload`
        # is all a renewal needs. Do not point this at a copy.
        ssl_certificate /etc/letsencrypt/live/attendance-api.kotoio.fi/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/attendance-api.kotoio.fi/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Note: CORS headers are handled by FastAPI CORSMiddleware in backend
        # Do not add CORS headers here to avoid duplication

        # API Proxy
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Auth endpoints with stricter rate limiting
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # API Documentation
        location /docs {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /redoc {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /openapi.json {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Root endpoint - simple status page or redirect to docs
        location = / {
            return 200 '{"status":"ok","message":"Student Attendance Tracker API - Frontend hosted on Vercel","docs":"/docs"}';
            add_header Content-Type application/json;
        }

        # Health check
        location /health {
            proxy_pass http://backend:8000;
            # Forwarded like everywhere else, so an app line from a health probe is still
            # attributable. There is no nginx access line to join it to here -- access_log is
            # off for this location on purpose, to keep the uptime probe out of the log.
            proxy_set_header X-Request-ID $request_id;
            access_log off;
        }
    }
}

