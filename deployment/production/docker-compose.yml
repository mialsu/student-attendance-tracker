# Compose derives the project name from this file's directory, which is `production` — verified
# on the VM: the running containers carry com.docker.compose.project=production. That was fine by
# accident, not by design: a project rename would orphan the running containers, and `up -d` would
# then fail with "the container name is already in use" against its own stack.
#
# Pinned so it can never depend on a directory again. The value is the one already in use, so this
# changes nothing today and prevents a whole class of surprise later.
name: production

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: attendance-db-prod
    restart: always
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - attendance-network
    # Only expose on localhost for security
    ports:
      - "127.0.0.1:5432:5432"

  # FastAPI Backend
  backend:
    build:
      # ../../api — the backend now lives beside this file in one repository, so the whole
      # deployable unit moves in a single commit. It used to be a separate repo pulled in by the
      # deploy job, which meant a compose change could not ship without an unrelated backend push.
      context: ../../api
      dockerfile: Dockerfile
    container_name: attendance-backend-prod
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      # COOKIE_DOMAIN is deliberately UNSET, so the refresh cookie is host-only to
      # attendance-api.kotoio.fi. It used to be `.kotoio.fi`, which sent the 30-day refresh
      # token to every host under that domain -- including app-attendance.kotoio.fi on Vercel,
      # which never needed it, and every future backend this VM is documented as able to host.
      # Removed 2026-09-02 by /audit; guarded by the API's tests/test_config.py::TestCookieScope.
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENVIRONMENT: production
      DEBUG: "false"
      # Basic auth for /docs, /redoc and /openapi.json. These were ABSENT from this block for
      # months while sitting correctly set in .env, so the container never received them and the
      # app fell back to its built-in admin/changeme. app/config.py now refuses to start without
      # them outside development, so a repeat cannot go unnoticed.
      DOCS_USERNAME: ${DOCS_USERNAME}
      DOCS_PASSWORD: ${DOCS_PASSWORD}
      # Tracing -> the jaeger service below, over the internal network only.
      # Removing OTEL_EXPORTER_OTLP_ENDPOINT is the off switch: app/core/telemetry.py returns
      # early rather than half-configuring itself, so the API runs untraced and unaffected.
      OTEL_SERVICE_NAME: attendance-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - attendance-network
    # Docker's json-file driver has no size limit by default, and nothing here set one, so
    # container logs grew without bound on a CX21's disk until someone noticed.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Not exposed outside container network

  # Nginx Reverse Proxy (API Gateway)
  nginx:
    image: nginx:alpine
    container_name: attendance-nginx-prod
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Read certs straight from the certbot live directory. Never copy them:
      # a copy goes stale the moment certbot renews.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for the ACME HTTP-01 challenge, so renewal never needs port 80.
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - attendance-network
    # Docker's json-file driver has no size limit by default, and nothing here set one, so
    # container logs grew without bound on a CX21's disk until someone noticed.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Jaeger — the trace store. deployment/jaeger.yaml (shared with local, so the two cannot drift)
  # says what it runs and what was stripped out of the stock config.
  #
  # NO AUTHENTICATION of its own, and the spans carry student UUIDs plus whatever a teacher typed
  # into a search box, so the UI is published on the LOOPBACK INTERFACE ONLY and reached with
  # `ssh -L 16686:localhost:16686`. Do not change this to "16686:16686": Docker writes its own
  # iptables rules and a published port BYPASSES UFW, which would put an unauthenticated trace UI
  # holding student data straight on the public internet with the firewall still looking correct.
  #
  # The OTLP port is not published at all — the backend reaches it as http://jaeger:4318 across
  # attendance-prod-network.
  #
  # Deliberately absent from the backend's depends_on: a trace store that is down must never hold
  # up the API. The exporter retries on a background thread and then drops the batch.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: attendance-jaeger-prod
    restart: always
    command: ["--config=file:/jaeger.yaml"]
    volumes:
      - ../jaeger.yaml:/jaeger.yaml:ro
    ports:
      - "127.0.0.1:16686:16686"
    # Second backstop under jaeger.yaml's max_traces. This box has 4 GB and PostgreSQL is on it;
    # an unbounded trace store is the thing that would OOM the database at 2am.
    mem_limit: 512m
    # Docker's json-file driver has no size limit by default, and nothing here set one, so
    # container logs grew without bound on a CX21's disk until someone noticed.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - attendance-network

volumes:
  postgres_data_prod:
    name: attendance_postgres_prod

networks:
  attendance-network:
    name: attendance-prod-network
    driver: bridge

