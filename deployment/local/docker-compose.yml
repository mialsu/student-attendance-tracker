version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: attendance-db-local
    restart: unless-stopped
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: local_dev_password_123
      POSTGRES_DB: attendance_tracker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-network

  # PostgreSQL Test Database (for running tests with real database)
  db-test:
    image: postgres:17-alpine
    container_name: attendance-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: test_password_123
      POSTGRES_DB: attendance_tracker_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_tracker_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-network
    profiles:
      - test

  # FastAPI Backend
  backend:
    build:
      context: ../../api
      dockerfile: Dockerfile
    container_name: attendance-backend-local
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../../api:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://attendance_user:local_dev_password_123@db:5432/attendance_tracker
      SECRET_KEY: local-dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      COOKIE_DOMAIN: ""
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
      ENVIRONMENT: development
      DEBUG: "true"
      # Tracing. Remove OTEL_EXPORTER_OTLP_ENDPOINT and the app runs with no telemetry at
      # all -- app/core/telemetry.py returns early rather than half-configuring itself.
      OTEL_SERVICE_NAME: attendance-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - attendance-network

  # Jaeger — the trace store. deployment/jaeger.yaml says what it runs and what was stripped out
  # of the stock config; the same file is mounted in production, so the two cannot drift.
  #
  # Deliberately NOT in the backend's depends_on: a trace store that is down must never be able
  # to hold up the API. The exporter retries with backoff on its own background thread and then
  # drops the batch, so the worst case is log noise.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: attendance-jaeger-local
    restart: unless-stopped
    command: ["--config=file:/jaeger.yaml"]
    volumes:
      - ../jaeger.yaml:/jaeger.yaml:ro
    ports:
      # The UI, on the loopback interface only. The OTLP port is NOT published: the backend
      # reaches it as http://jaeger:4318 across the compose network.
      - "127.0.0.1:16686:16686"
    mem_limit: 512m
    networks:
      - attendance-network

volumes:
  postgres_data_local:
    name: attendance_postgres_local

networks:
  attendance-network:
    name: attendance-local-network
    driver: bridge

