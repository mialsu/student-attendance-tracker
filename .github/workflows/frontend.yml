name: Frontend

# Gates run on every push and PR. Deploy runs ONLY after gates and security are green, and only on
# a push to main — Vercel's git auto-deploy must be turned OFF in the Vercel dashboard for this to
# be a real gate rather than a race (see docs/adr/0003-frontend-deploy-from-ci.md).

on:
  push:
    branches: [main]
    paths: &frontend_paths
      - 'client/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths: *frontend_paths
  workflow_dispatch:

# Least privilege. Nothing here needs write access to the repo.
permissions:
  contents: read

concurrency:
  # Supersede in-flight CI on the same ref, but never cancel a PR-unrelated main run mid-deploy
  # (the deploy job carries its own non-cancelling group).
  #
  # github.workflow is IN the group deliberately: concurrency groups are REPOSITORY-wide, so while
  # this was `ci-${{ github.ref }}` this workflow and backend.yml shared one slot and could cancel
  # each other. It happened — Backend run 33743740347 on 2026-09-03, cancelled with zero jobs when
  # a Frontend run took the pending slot. backend.yml carries the full account.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  # CI must never rewrite .harness-baseline: the runner is ephemeral, so the write would be
  # discarded and CI would look like it had ratcheted when it had not.
  BASELINE_FROZEN: '1'

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          # The drift gate is a DIFF gate — it needs history to resolve a range. With the default
          # shallow clone it would compare nothing and report clean: a false pass.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      # Cheapest first, so a failure surfaces fast. Same set and order as `npm run check`
      # and .husky/pre-commit.
      - name: Boundaries (dependency-cruiser)
        run: npm run lint:boundaries

      - name: Drift + repo-specific checks
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: ./scripts/drift-ci.sh

      - name: Typecheck (ratchet)
        run: npm run gate:typecheck

      - name: Lint (ratchet)
        run: npm run gate:lint

      # KNOWN RISK: 25 of 90 tests fail on main and are absorbed by the ratchet baseline. One of
      # them makes a real HTTP call to localhost:8000, so the failure COUNT could differ on a runner
      # with no server there. If this step flakes, the fix is to mock at the src/api seam (or
      # quarantine AuthContext.test.tsx with a REVIEW-DEBT entry) — not to raise the baseline.
      - name: Tests (ratchet)
        run: npm run gate:tests

      - name: Production build
        run: npm run build

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      # REPORT-ONLY by deliberate choice: a new upstream CVE published overnight must not block an
      # unrelated deploy. Read the job summary; promote to a hard gate when the noise is known.
      - name: npm audit (report-only)
        run: |
          set -uo pipefail
          {
            echo "## npm audit"
            echo
            echo '```'
            npm audit --audit-level=high 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Vercel (production)
    needs: [gates, security]
    # Every push to main that passes gates + security deploys. Vercel's own git integration must
    # stay DISCONNECTED (Settings -> Git -> Connected Git Repository), or both paths deploy and
    # race. Note that an empty "Deploy Hooks" list is NOT evidence that auto-deploy is off.
    # Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
    # Same cutover switch as backend.yml: skipped until DEPLOY_ENABLED is set, so the gates can
    # be proven in the monorepo layout before anything ships to Vercel.
    if: >-
      vars.DEPLOY_ENABLED == 'true'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # A deploy is never cancelled mid-flight, and two deploys never overlap.
    concurrency:
      group: fe-deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # `vercel pull` fails with a single unhelpful line ("Could not retrieve Project Settings")
      # for THREE different causes: a missing secret, a rejected token, or a project the token's
      # scope cannot see. This separates them before the CLI gets a chance to conflate them.
      # No secret values are printed — lengths and non-secret id prefixes only.
      - name: Preflight — resolve Vercel credentials
        run: |
          set -uo pipefail
          fail=0
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "✖ VERCEL_TOKEN is empty or not set"; fail=1
          else
            echo "✔ VERCEL_TOKEN present (${#VERCEL_TOKEN} chars)"
          fi
          for v in VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            val="$(eval printf '%s' "\${$v:-}")"
            if [ -z "$val" ]; then
              echo "✖ $v is empty or not set"; fail=1
            else
              # Org/project ids are identifiers, not credentials — a prefix is safe and tells us
              # whether this is a team scope (team_…) or a personal account.
              echo "✔ $v present (${#val} chars, prefix '$(printf '%s' "$val" | cut -c1-5)…')"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo
            echo "Add the missing repo secrets: Settings → Secrets and variables → Actions →"
            echo "Repository secrets. VERCEL_ORG_ID and VERCEL_PROJECT_ID come from the Vercel"
            echo "dashboard (Project → Settings → General for the project id; Account/Team →"
            echo "Settings for the org id). A stale local .vercel/project.json can disagree with"
            echo "the dashboard if the project was ever moved between a personal account and a team."
            exit 1
          fi
          echo
          echo "── token identity ──"
          if ! vercel whoami --token="$VERCEL_TOKEN"; then
            echo "✖ the token itself was rejected — regenerate it at vercel.com/account/tokens"
            exit 1
          fi
          echo
          echo "── projects visible to this token ──"
          vercel project ls --token="$VERCEL_TOKEN" 2>&1 | head -30 || true
          echo
          echo "If the target project is NOT listed above, the token's scope is wrong: a token"
          echo "scoped to your personal account cannot see a team's project (or vice versa)."
          echo "VERCEL_ORG_ID must match the scope the token belongs to."

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output
        id: deploy
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Verify the deployment serves
        run: |
          set -euo pipefail
          target="https://app-attendance.kotoio.fi"
          for i in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$target" || echo 000)"
            if [ "$code" = "200" ]; then echo "✔ $target -> 200"; exit 0; fi
            echo "  attempt $i: $code — retrying in 5s"; sleep 5
          done
          echo "✖ $target never returned 200"; exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Frontend deploy"
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- deployment: ${{ steps.deploy.outputs.url }}"
            echo "- live: https://app-attendance.kotoio.fi"
          } >> "$GITHUB_STEP_SUMMARY"
