name: Security

# Secret scanning belongs to the REPOSITORY, not to a package. It used to exist as two identical
# copies, one in the backend workflow and one in the frontend's — two implementations of one
# behaviour, which drift and then leave you unsure which is authoritative (ANTI-PATTERNS.md).
#
# Deliberately NOT path-filtered. A secret committed anywhere must be caught, including by a change
# that touches only docs or a workflow file, and the scan is cheap enough to run on everything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # History, not a snapshot: a key committed in March and "removed" in April is still
          # leaked. A shallow clone would scan almost nothing and pass.
          fetch-depth: 0

      # Baseline measured 2026-09-01: 108 findings, all documentation placeholders, all
      # allowlisted BY VALUE (not by path), so a real token pasted into API_REFERENCE.md
      # still fails this step. Verified by planting one.
      #
      # The version is EXACT and the tarball's checksum is checked (ADR-0010). This step used to ask
      # the GitHub API for the latest release on every run, without a token, and on 2026-10-01
      # that call returned 403 and failed #21's scan; the pull request had changed one image tag.
      # Dependabot does not read this line, so the version moves by hand: take the new
      # release's sha256 from its gitleaks_<version>_checksums.txt, and hash the tarball yourself.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz gitleaks
          # The allowlist lives with the backend because that is where the 108 documentation
          # placeholders are, and it allowlists BY VALUE, so a real token in the same file fails.
          ./gitleaks git . --redact --no-banner --verbose --config api/.gitleaks.toml
