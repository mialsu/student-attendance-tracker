name: CI & Deploy

# Gates and tests run on every push and PR. Deploy runs only after ALL of them are green, and only
# on a push to main.
#
# What the deploy job can and cannot undo — read this before trusting the rollback:
#   CAN  roll back application CODE (git SHA + rebuild) automatically when the health check fails.
#   CANNOT roll back a MIGRATION. Alembic has already run by then. The pre-deploy pg_dump is the
#          schema rollback path and restoring it is a DELIBERATE MANUAL act, because it discards
#          every write since the dump. The workflow prints the backup path and the exact restore
#          command; it never restores automatically.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'
  BASELINE_FROZEN: '1'   # CI must never rewrite .harness-baseline (ephemeral runner)

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The drift gate is a DIFF gate and needs history to resolve a range. A shallow clone
          # would make it compare nothing and report clean: a false pass.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # These are the gates the pre-commit hook runs. Without them here, `just check-fast` is
      # enforced only on machines where someone ran `just install-hooks`, and `--no-verify`
      # bypasses it entirely.
      - name: Boundaries (import-linter)
        run: lint-imports

      - name: Drift + repo-specific checks
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: ./scripts/drift-ci.sh

      - name: Lint (ruff ratchet)
        run: ./scripts/baseline-guard.sh ruff ruff check app tests

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # TEST_DATABASE_URL is mandatory — tests/conftest.py has no default, because the fixtures
      # DROP tables and the old default pointed at whatever was on port 5433.
      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 15
          REFRESH_TOKEN_EXPIRE_DAYS: 30
          COOKIE_SECURE: 'false'
          COOKIE_SAMESITE: lax
          COOKIE_DOMAIN: ''
          CORS_ORIGINS: http://localhost:5173
          ENVIRONMENT: test
          DEBUG: 'false'
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=html

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      # Standing reminder, printed where it will actually be read. Removing the teacher-ownership
      # filter from app/services/class_service.py:54 leaves all 262 of these tests passing with
      # byte-identical coverage. Green here does not mean authorization holds.
      - name: Note what these tests do not prove
        if: always()
        run: |
          {
            echo "## What the green suite does not prove"
            echo
            echo "Authorization is **not** tested from the denied side. Removing the teacher-ownership"
            echo "filter from \`app/services/class_service.py:54\` leaves every test passing."
            echo "See \`REVIEW-DEBT.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Baseline measured 2026-09-01: 108 findings, all documentation placeholders, all allowlisted
      # by VALUE (not by path) in .gitleaks.toml — so a real token pasted into API_REFERENCE.md
      # still fails this step. Verified by planting one.
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          # Capture the response into a variable BEFORE parsing it. Piping curl straight into
          # `grep -m1` makes grep close the pipe on its first match, curl then fails with
          # CURLE_WRITE_ERROR (23), and `pipefail` fails the whole step. Verified by running it.
          api_json="$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest)"
          tag="$(printf '%s' "$api_json" | grep '"tag_name"' | head -1 | cut -d'"' -f4)"
          if [ -z "$tag" ]; then echo "could not resolve gitleaks release tag"; exit 1; fi
          ver="${tag#v}"
          echo "gitleaks $tag"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${tag}/gitleaks_${ver}_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --verbose --config .gitleaks.toml

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # REPORT-ONLY by deliberate choice: a CVE published overnight must not block an unrelated
      # deploy. Read the job summary; promote to a hard gate once the noise is known.
      - name: pip-audit (report-only)
        run: |
          set -uo pipefail
          pip install --quiet pip-audit
          {
            echo "## pip-audit"
            echo
            echo '```'
            pip-audit -r requirements.txt 2>&1 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Hetzner (production)
    needs: [gates, test, security]
    # DEPLOY SWITCH — off until the repository variable DEPLOY_ENABLED is set to 'true'
    # (Settings -> Secrets and variables -> Actions -> Variables). Gates, tests and security run
    # on every push regardless; this job SKIPS (it does not fail) while the switch is off.
    #
    # BEHAVIOUR CHANGE, read this: the PREVIOUS workflow deployed on every push to main. With the
    # switch off, pushing no longer deploys. That is deliberate — this deploy job is rewritten and
    # has never run, so the first execution should be a watched `workflow_dispatch`, not a
    # surprise on a feature push. Set the variable when you are ready to deploy again.
    if: |
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # A deploy is never cancelled mid-flight, and two deploys never overlap on one VM.
    concurrency:
      group: be-deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail

            PROJECT="${{ secrets.PROJECT_PATH }}"
            TARGET_SHA="${{ github.sha }}"
            COMPOSE="docker compose -f deployment/production/docker-compose.yml"
            HEALTH="https://attendance-api.kotoio.fi/health"

            cd "$PROJECT"

            # ---- 1. Record the SHA we can return to -------------------------------------------
            PREV_SHA="$(git -C student-attendance-tracker-api rev-parse HEAD)"
            echo "::group::Deploy plan"
            echo "  from : $PREV_SHA"
            echo "  to   : $TARGET_SHA"
            echo "::endgroup::"

            # ---- 2. Pre-deploy backup, VERIFIED ----------------------------------------------
            # backup-db.sh pipes pg_dump into gzip without `set -o pipefail`, so a failed dump
            # writes a truncated archive and still exits 0. Verify the artifact, never the exit code.
            echo "::group::Database backup"
            ./deployment/scripts/backup-db.sh production
            BACKUP="$(ls -t deployment/production/backups/backup_*.sql.gz | head -1)"
            gzip -t "$BACKUP"
            BSIZE="$(stat -c%s "$BACKUP")"
            if [ "$BSIZE" -lt 2000 ]; then
              echo "✖ backup $BACKUP is only ${BSIZE}B — refusing to deploy without a usable backup."
              exit 1
            fi
            echo "✔ backup verified: $BACKUP (${BSIZE} bytes)"
            echo "::endgroup::"

            # ---- 3. Fetch the exact commit under test ----------------------------------------
            echo "::group::Fetch code"
            git -C student-attendance-tracker-api fetch --quiet origin
            git -C student-attendance-tracker-api reset --hard "$TARGET_SHA"
            git -C deployment fetch --quiet origin
            git -C deployment reset --hard origin/master
            echo "::endgroup::"

            # ---- 4. Build. WITH the layer cache: --no-cache tripled the downtime window for no
            #         benefit, since the image is rebuilt from a pinned commit either way. --------
            echo "::group::Build backend image"
            $COMPOSE build backend
            IMG="$($COMPOSE images -q backend 2>/dev/null | head -1 || true)"
            if [ -n "$IMG" ]; then
              docker tag "$IMG" "attendance-backend:${TARGET_SHA}" || true
              echo "tagged attendance-backend:${TARGET_SHA}"
            fi
            echo "::endgroup::"

            # ---- 5. Migrations as an EXPLICIT step, while the old container is still serving ---
            # The container's own command also runs `alembic upgrade head`; it is idempotent, so
            # this second run is a no-op. Doing it here means a bad migration fails the deploy
            # instead of putting the new container into a restart loop behind `restart: always`.
            echo "::group::Migrations"
            if ! $COMPOSE run --rm backend alembic upgrade head; then
              echo "✖ migration failed. NOTHING was swapped — the previous container is still serving."
              echo "  Schema rollback, if the migration partially applied, is MANUAL:"
              echo "    ./deployment/scripts/restore-db.sh production $BACKUP"
              exit 1
            fi
            echo "::endgroup::"

            # ---- 6. Swap ONLY the app and the proxy. The database is never taken down: the old
            #         `compose down` stopped postgres too, which turned every deploy into a
            #         database outage for no reason. --------------------------------------------
            echo "::group::Recreate backend + nginx"
            $COMPOSE up -d --no-deps backend nginx
            echo "::endgroup::"

            # ---- 7. Health check with retries, not `sleep 15` ---------------------------------
            echo "::group::Health check"
            ok=0
            for i in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH" || echo 000)"
              if [ "$code" = "200" ]; then ok=1; echo "✔ healthy after ${i} attempt(s)"; break; fi
              echo "  attempt ${i}/30: $code"
              sleep 4
            done
            echo "::endgroup::"

            # ---- 8. Automatic CODE rollback on failure ---------------------------------------
            if [ "$ok" -ne 1 ]; then
              echo "::group::Health check FAILED — rolling back code to $PREV_SHA"
              $COMPOSE logs --tail=80 backend || true
              git -C student-attendance-tracker-api reset --hard "$PREV_SHA"
              $COMPOSE build backend
              $COMPOSE up -d --no-deps backend nginx
              rb=0
              for i in $(seq 1 30); do
                code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH" || echo 000)"
                if [ "$code" = "200" ]; then rb=1; echo "✔ rolled back and healthy"; break; fi
                sleep 4
              done
              echo "::endgroup::"
              echo "✖ DEPLOY FAILED. Code is back at $PREV_SHA (healthy=$rb)."
              echo "  The MIGRATION WAS NOT ROLLED BACK — alembic already ran."
              echo "  If the new schema breaks the old code, restore manually:"
              echo "    ./deployment/scripts/restore-db.sh production $BACKUP"
              echo "  That discards every write since the backup, so it is a deliberate decision."
              exit 1
            fi

            # ---- 9. Housekeeping: a CX21 has limited disk and every deploy adds layers --------
            docker image prune -f --filter "until=168h" >/dev/null 2>&1 || true

            echo "✅ Deployed $TARGET_SHA"
            $COMPOSE ps

      - name: Summary
        if: always()
        run: |
          {
            echo "## Backend deploy"
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- result: ${{ job.status }}"
            echo "- API: https://attendance-api.kotoio.fi"
            echo "- docs: https://attendance-api.kotoio.fi/docs"
            echo
            echo "Automatic rollback restores CODE only. A migration is never rolled back"
            echo "automatically — the pre-deploy backup path is printed in the deploy log."
          } >> "$GITHUB_STEP_SUMMARY"
