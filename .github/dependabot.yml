# Scheduled version updates, ADR-0009 and ADR-0010. The two Python locks, the client's lockfile and
# the compose image tags are exact, so nothing in them moves until one of these pull requests is
# merged, and CI runs on each one first. The actions are referenced by major tag and float inside
# it. Monthly, one grouped pull request per ecosystem, and major versions are never proposed: a
# major version is a decision to make on purpose, in a change of its own.
#
# Merging a pip or docker-compose pull request deploys the backend, as any push to main does.
version: 2
updates:
  # /api holds two pip-compile locks: requirements.in -> requirements.txt, and requirements-dev.in
  # -> requirements-dev.txt. Dependabot recompiles them with the command in their headers, so a
  # pull request it opens has been through a resolver. Proposing lines one at a time is how #23
  # asked for a pydantic_core no released pydantic accepts (ADR-0010).
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # opentelemetry-instrumentation-sqlalchemy declares sqlalchemy < 2.1.0 up to 0.66b0, and on
      # 2.1 it declines to instrument, which drops every SQL span from Jaeger (ADR-0009). Delete
      # this entry once a release declares 2.1 support; the OpenTelemetry pins then move together.
      - dependency-name: sqlalchemy
        versions: [">=2.1"]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directories: ["/deployment/production", "/deployment/local"]
    schedule:
      interval: monthly
    groups:
      # Everything but postgres. A new postgres tag restarts the production database when the
      # deploy runs its migrations (deployment/production/docker-compose.yml says why), so it
      # arrives as a pull request of its own and is merged as a deliberate act.
      images:
        patterns: ["*"]
        exclude-patterns: ["postgres"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Everything but appleboy/ssh-action, which runs the production deploy. CI never executes
      # that step before a merge, so the deploy itself is the first run of a new version, and it
      # arrives on its own for that reason.
      actions:
        patterns: ["*"]
        exclude-patterns: ["appleboy/ssh-action"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
